<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="setup">
      <div class="sides">
        <fieldset class="side" id="side-w">
          <legend>White</legend>
          <label>CLI <select id="type-w"></select></label>
          <label id="model-w-wrap">Model <select id="model-w"></select></label>
          <input id="model-w-other" class="model-other" type="text" placeholder="model name" aria-label="Model name" autocomplete="off" spellcheck="false" hidden>
          <p class="model-note" id="model-w-note"></p>
        </fieldset>
        <button id="swap" type="button" title="Swap the two sides" aria-label="Swap the two sides">&#8644;</button>
        <fieldset class="side" id="side-b">
          <legend>Black</legend>
          <label>CLI <select id="type-b"></select></label>
          <label id="model-b-wrap">Model <select id="model-b"></select></label>
          <input id="model-b-other" class="model-other" type="text" placeholder="model name" aria-label="Model name" autocomplete="off" spellcheck="false" hidden>
          <p class="model-note" id="model-b-note"></p>
        </fieldset>
      </div>
      <p id="versus"></p>
      <button id="start" type="button" disabled>Start game</button>
      <span id="start-why" role="status"></span>
    </section>
    <p id="status" role="status"></p>
    <p id="hint" role="status"></p>
    <div id="stage">
      <div class="who who-b" id="who-b"><span class="dot"></span><span class="name"></span><span class="turn"></span></div>
      <div id="board" role="img" aria-label="Chess board"></div>
      <div class="who who-w" id="who-w"><span class="dot"></span><span class="name"></span><span class="turn"></span></div>
    </div>
    <section id="after" hidden>
      <p id="result"></p>
      <div class="buttons">
        <button id="rematch" type="button">Rematch</button>
        <button id="swapcolours" type="button">Swap colours</button>
        <button id="change" type="button">Change players</button>
      </div>
    </section>
    <p id="still"></p>
    <p id="moves"></p>
    <ol id="log"></ol>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
