# agmsg app add-on manifest. Data only: key = value, one per line.
title = Chess
entry = index.html
protocol = 1
permissions = messages:read, team:join, messages:send, agents:spawn
member = chess
why.messages:read = Receives the moves the two players send back to the referee.
why.team:join = Joins the team as the referee "chess", so the players can reply to it.
why.messages:send = Sends each player the position and asks for one move.
why.agents:spawn = Starts the two players, white and black, as agents in this team.
